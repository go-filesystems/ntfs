name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Minimum statement coverage required from the `-short` test run.
# `go test -short -cover ./...` reports 86.2% today; gate just below it so
# the build stays green while still catching regressions.
env:
  COVERAGE_MIN: "86.0"

jobs:
  # Native runners: build + test (with coverage) on the two arches GitHub
  # offers hosted runners for. The heavy stress tests gate themselves behind
  # testing.Short(), so `-short` keeps these runs fast and deterministic while
  # still exercising every code path that the emulated jobs run.
  native:
    name: native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout ntfs
        uses: actions/checkout@v7
        with:
          path: ntfs

      # go.mod carries `replace github.com/go-filesystems/interface =>
      # ../interface`, so the sibling module must sit next to this one.
      - name: Checkout interface (sibling replace target)
        uses: actions/checkout@v7
        with:
          repository: go-filesystems/interface
          path: interface

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: ntfs/go.mod

      - name: Build
        working-directory: ntfs
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Test (short, race, coverage)
        working-directory: ntfs
        run: |
          set -euo pipefail
          go test -short -race -timeout 20m \
            -coverprofile=cover.out -covermode=atomic ./...

      - name: Enforce coverage floor
        working-directory: ntfs
        run: |
          set -euo pipefail
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "total coverage: ${total}% (floor ${COVERAGE_MIN}%)"
          awk -v c="$total" -v min="$COVERAGE_MIN" \
            'BEGIN { exit (c+0 >= min+0) ? 0 : 1 }' \
            || { echo "coverage ${total}% below floor ${COVERAGE_MIN}%"; exit 1; }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.arch }}
          path: ntfs/cover.out
          if-no-files-found: ignore

  # Emulated runners: cross-compile a static (CGO_ENABLED=0) test binary per
  # package and run it under QEMU for each non-native 64-bit arch. We run the
  # binaries with -test.short so the heavy stress tests (4 GiB files, 1M-file
  # loops) don't blow QEMU's time/memory budget.
  #
  # s390x is big-endian: NTFS's NTFSIMG1 on-disk format is little-endian and
  # every decoder/encoder uses explicit binary.LittleEndian, so the s390x leg
  # cross-checks that the byte-order handling is host-endianness-independent.
  emulated:
    name: emulated ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu: rv64,v=true,vlen=128
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu: la464
          - arch: ppc64le
            image: debian:trixie
            qemu: power9
          - arch: s390x
            image: debian:trixie
            qemu: qemu
    steps:
      - name: Checkout ntfs
        uses: actions/checkout@v7
        with:
          path: ntfs

      - name: Checkout interface (sibling replace target)
        uses: actions/checkout@v7
        with:
          repository: go-filesystems/interface
          path: interface

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true
          cache-dependency-path: ntfs/go.mod

      - name: Register QEMU binfmt handlers
        run: docker run --rm --privileged tonistiigi/binfmt --install all

      # Build the test binaries *inside* the checkout. The compat tests locate
      # their fixtures via runtime.Caller(0), which bakes the build-time source
      # path into the binary, so the binaries must run with the source tree
      # mounted at that same absolute path (handled in the next step). We drop
      # them under <repo>/.qemu-tests so a single bind mount covers both the
      # binaries and the testdata/ fixtures they read.
      - name: Cross-compile per-package test binaries
        working-directory: ntfs
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p .qemu-tests
          for pkg in $(go list ./...); do
            name=$(echo "$pkg" | tr '/' '_')
            # Skip packages without test files (go test -c emits no binary).
            go test -c -cover -o ".qemu-tests/${name}.test" "$pkg"
            if [ -f ".qemu-tests/${name}.test" ]; then
              echo "built ${name}.test"
            fi
          done
          ls -la .qemu-tests

      # Run each binary under QEMU with the checkout bind-mounted at its real
      # host path, so runtime.Caller-derived fixture paths resolve. Pass
      # -test.short to skip the multi-GiB / million-file stress tests, which
      # would exhaust QEMU's time and memory budget.
      - name: Run test binaries under QEMU (${{ matrix.arch }})
        env:
          QEMU_CPU: ${{ matrix.qemu }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          repo="${{ github.workspace }}/ntfs"
          bins=("$repo"/.qemu-tests/*.test)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "no test binaries to run"; exit 0
          fi
          rc=0
          for bin in "${bins[@]}"; do
            echo "::group::$(basename "$bin")"
            if ! docker run --rm \
              --platform linux/${{ matrix.arch }} \
              -e QEMU_CPU="${QEMU_CPU}" \
              -v "$repo":"$repo" \
              -w "$repo/.qemu-tests" \
              ${{ matrix.image }} \
              "./$(basename "$bin")" -test.short -test.v; then
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc
